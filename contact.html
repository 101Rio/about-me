<main id="main" tabindex="-1">
    <div class="wrap chapter">
        <nav class="breadcrumbs" aria-label="パンくずリスト">
            <a href="index.html" lang="en">Top</a><i aria-hidden="true">/</i><span aria-current="page" lang="en">Contact</span>
        </nav>
        <div class="contact-layout">
            <div class="contact-intro">
                <div class="chapter-heading">
            <p class="eyebrow">お問い合わせ</p>
            <h1 class="chapter-title" lang="en">Contact<span class="period">.</span></h1>
            <p class="chapter-lead">サイトの感想や制作のご相談を、こちらで下書きできます。</p>
        </div>
                <div class="contact-note">
                    <canvas data-art="mail" width="88" height="64" aria-hidden="true"></canvas>
                    <div><h2>デモフォームについて</h2><p>入力した内容は、この画面で確認・コピーできます。外部への送信は行いません。</p></div>
                </div>
            </div>
            <section class="form-panel" id="contact-cta" aria-label="メッセージの下書き">
                <form id="contact-form">
                    <fieldset id="draft-fields" disabled>
                        <legend class="sr-only">お問い合わせ内容</legend>
                        <div class="form-group"><label for="name">お名前 <small>必須</small></label><input name="name" id="name" type="text" autocomplete="name" placeholder="山田 太郎" required></div>
                        <div class="form-group"><label for="email">メールアドレス <small>必須</small></label><input name="email" id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
                        <div class="form-group"><label for="subject">件名 <small class="optional">任意</small></label><input name="subject" id="subject" type="text" placeholder="お問い合わせの件名"></div>
                        <div class="form-group"><label for="message">メッセージ <small>必須</small></label><textarea name="message" id="message" rows="5" placeholder="メッセージをご記入ください" required></textarea></div>
                        <button type="submit" class="button button-primary">内容を確認する <i class="arrow arrow-right" aria-hidden="true"></i></button>
                    </fieldset>
                    <noscript><p>フォームを利用するには JavaScript を有効にしてください。</p></noscript>
                </form>
                <div class="draft-preview" id="draft-preview" hidden>
                    <p class="item-label" lang="en">Preview</p>
                    <h2 tabindex="-1" id="preview-title">入力内容の確認</h2>
                    <dl>
                        <div><dt>お名前</dt><dd data-field="name"></dd></div>
                        <div><dt>メールアドレス</dt><dd data-field="email"></dd></div>
                        <div><dt>件名</dt><dd data-field="subject"></dd></div>
                        <div><dt>メッセージ</dt><dd data-field="message"></dd></div>
                    </dl>
                    <div class="form-actions"><button type="button" class="button button-primary" id="copy-draft">内容をコピー</button><button type="button" class="quiet-link" id="edit-draft">入力に戻る</button></div>
                    <p class="copy-status" role="status"></p>
                </div>
            </section>
        </div>
    </div>
</main>
